name: Tests

on:
  push:
    branches-ignore:
      - gh-pages
  pull_request:
  workflow_call:

jobs:
  npm-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
  tsc:
    runs-on: ubuntu-latest
    needs: npm-cache
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - name: Compile TypeScript and run unit tests
        run: |
          npm ci
          npm run test:tsc
          npm run test:unit
  xo:
    runs-on: ubuntu-latest
    needs: npm-cache
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - name: Lint source code
        run: |
          npm ci
          npm run lint:xo
  stylelint:
    runs-on: ubuntu-latest
    needs: npm-cache
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - name: Lint styles
        run: |
          npm ci
          npm run lint:stylelint
  rpmspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint rpm spec file
        uses: EyeCantCU/rpmlint-action@v0.1.1
        with:
          rpmfiles: packages/rpm/caprine.spec
